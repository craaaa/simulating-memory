# Search set: the 8 tasks a candidate is optimized against.
#
# Held out and deliberately absent: wm_map_task and wm_factual_qa.
#
# IMPORTANT -- do NOT pass --repeat with this config. `--repeat` is global, so it
# cannot simultaneously give 50 participants on most tasks and a reduced digit
# span. Every task is sizable from task_config when --repeat is omitted (verified
# against each task's closure in bench/cli.py), so sizes are set explicitly here.
# Note also that `run.repeat` is inert: cli.py:179 only writes the CLI --repeat
# into run_cfg and never reads it back.
#
# Digit span is cut from the released 1900 rows to 760 each. Forward and reverse
# together were 85% of all LLM turns in a full evaluation (16,975 of 19,940) for
# 0.307 + 0.106 of headroom, which is why they are cut at all. Full repeats are
# restored for final scoring of the finalists.
#
# RAISED 2026-09-29 [USER] from 10 sequences/span to 40. `sequences_per_span` sets the
# matched-comparison n directly: `protocol_match.model_participants` pairs ADJACENT
# sequence_index values to build the 2-trials-per-span blocks the human staircase
# administers, so matched pseudo-participants = sequences_per_span / 2. At 10 that was
# **5**, against 53 humans -- too few to compare a `best_span` distribution against, and
# `best_span` is now the only digit-span diagnostic reported (A1 was retired the same day).
# 40 gives **20**.
#
# Cost, stated in LLM calls so it can be weighed: 19 spans x 40 = 760 rows per task, both
# tasks 1520, at 1 encode turn + 1 recall each = 3040 calls, up from 760. The +2280 is
# modest against what the instrument fixes already added -- post-fix n-back is ~5100 calls
# (150 blocks x ~17 letters x 2 turns) and stage-2 word_recognition is up to 10,000
# (50 participants x 100 words x 2 turns, cut back by the third-error stop).
#
# Do NOT read `best_span` across runs with different `sequences_per_span`: the estimator is
# not invariant to trials-per-span (audit M4 -- the same 190 rows give 8.70 / 18.40 / 20
# digits depending on grouping), so a change here breaks comparability with every earlier run.
model:
  backend: openai
  name: Qwen/Qwen3-30B-A3B-Instruct-2507
  base_url: http://127.0.0.1:8000/v1
  temperature: 0.0
  max_tokens: 2048
  top_p: 1.0

run:
  out_dir: meta_harness/runs/search/{date}
  seed: 42
  max_parallel_participants: 50   # measured KV cache supports 89.54x concurrency
  max_parallel_tasks: 1           # one model server; tasks share it

task_config:
  # --- working memory ------------------------------------------------------
  # 19 spans (2..20) x 40 sequences = 760 rows each, down from 1900 and up from 190.
  # 40 sequences -> 20 matched pseudo-participants; see the note at the top of this file.
  wm_digit_span_forward:
    min_span: 2
    max_span: 20
    sequences_per_span: 40
    stimuli_seed: 42
    temperature: 0.0
  wm_digit_span_reverse:
    min_span: 2
    max_span: 20
    sequences_per_span: 40
    stimuli_seed: 42
    temperature: 0.0
  wm_nback:
    n_repeat: 50                  # x3 n-levels = 150 rows, as released
    n_repeats_per_participant: 1
    stimuli_seed: 123
    temperature: 0
  wm_word_recognition:            # carries A2: miss - fa, report-only since 2026-09-29
    words_json_path: data/words.json
    n_repeat: 50                  # 50 rows, as released
    max_trials_per_game: 100
    stimuli_seed: 42
    temperature: 0.0
  wm_variable_mapping:
    names_json_path: data/names.json
    city_json_path: data/city.json
    n_repeat: 50                  # x3 runs per participant = 150 rows
    n_runs_per_participant: 3
    stimuli_seed: 42

  # --- longer-horizon memory ----------------------------------------------
  wm_narrative_qa:
    data_json_path: data/narrative_QA.json
    n_participants: 50
    stimuli_seed: 42
  wm_semantic_story_recall:       # carries axis A3
    repeats_per_stimulus: 50      # x4 stories = 200 rows, as released
    stimuli_seed: 42
    use_judge: true
    recall_max_tokens: 16384
  wm_craft_task:
    data_json_path: data/craft_task.json
    n_participants: 50
    stimuli_seed: 42

# Reproduction gate: does the local vLLM serving stack reproduce the released
# OpenRouter baseline for qwen3-30b-a3b on wm_word_recognition?
#
# This runs BEFORE any harness search.  If local vLLM and the released run
# disagree (sampling defaults, chat template, tokenizer revision), then the
# 0.167 headroom figure the whole plan rests on is measuring something else.
#
# Released reference (runs/compactor/qwen_qwen3-30b-a3b-instruct-2507):
#   wm_word_recognition  n=50   miss/fa ratio 0.018   mean trials 87.5
#
# Model/run settings below are copied verbatim from that run's
# config_snapshot.json, except base_url and name, which point at local vLLM.
model:
  backend: openai
  name: Qwen/Qwen3-30B-A3B-Instruct-2507
  base_url: http://127.0.0.1:8000/v1
  temperature: 0.0
  max_tokens: 2048
  top_p: 1.0

run:
  out_dir: meta_harness/runs/gate/{date}
  seed: 42
  max_parallel_participants: 50
  max_parallel_tasks: 1
  repeat: 50

task_config:
  wm_word_recognition:
    words_json_path: data/words.json
    n_repeat: 5
    max_trials_per_game: 100
    stimuli_seed: 42

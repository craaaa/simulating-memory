# Blind option-type + cue_match labels. Derived ONLY from question banks, blind to all results.
# option_type: true | false_interference | false_plain
#   true               = option is in the question's `answer` list
#   false_interference = trait-swap / cross-entity foil (content from another entity in the
#                        passage family, or a mismatched label-description pairing)
#   false_plain        = generic wrong answer, invented distractor, or NOTA when not the answer
# cue_match: exact (near-verbatim lift of passage wording/term) | paraphrase (restated)
# attention_check: true  = this option belongs to an attention_check question (marked, still labeled)
# NOTE: several `notes` fields describe an option ordering that no longer matches the current
#       option text (banks were edited). Labels were derived from the current option text +
#       the foil-provenance intent, not stale ordering.

# Multi-select question bank for the cloud_types topic (multi_v2)
# Concepts: Flocculenth Cloud (Nimbofloccus crenatus)
#
# Tested features:
#   - Shape + edge appearance        (QCL01)
#   - Altitude + composition         (QCL02)
#   - Scientific name + classifier   (QCL03)
#   - Color × weather signal (2×2)   (QCL04)
#   - Trick (all wrong, name only)   (QCL05)

questions:
  - q_id: QB02
    question: "Which of the following accurately describes what the Copperhook Finch eats? Select all that apply."
    options:
      1: "Seeds and fruit make up its main diet"
      2: "Nuts are not part of its diet"
      3: "Its diet consists primarily of insects and carrion"
      4: "It relies on seeds alone, avoiding fruit"
      5: "None of the above"
    answer: [1, 2]
    metadata:
      type: content
      feature: diet
      concepts: [copperhook_finch]
      notes: >
        Option 1 paraphrases 'feeds on seeds and fruit'. Option 2 paraphrases 'nuts aren't part of its
        diet'. Option 3 uses the Ashen Skreel's diet (insects and small carrion) as a foil. Option 4
        is a plausible foil. Grub-eating (mentioned incidentally in control) is omitted to maintain
        2-correct structure; the question targets the two main diet facts and the explicit nut exclusion.
        Revised from answer=[1,2,3] (3 correct) to comply with Q1 two-correct rule.

  - q_id: QB05
    question: "Which of the following accurately describes the Copperhook Finch's appearance? Select all that apply."
    options:
      1: "A warm rust-orange body"
      2: "Black-tipped wings"
      3: "White-tipped wings"
      4: "Muted slate-gray plumage"
      5: "None of the above"
    answer: [1, 2]
    metadata:
      type: content
      feature: plumage
      concepts: [copperhook_finch]
      notes: >
        Splits the control sentence 'Its body is a warm rust-orange, set off by sharp black wingtips'
        into two independently testable sub-claims. Option 1 paraphrases 'warm rust-orange' body.
        Option 2 paraphrases 'sharp black wingtips'. Option 3 is a plausible foil (wrong tip color).
        Option 4 is the Ashen Skreel's plumage (dropped concept foil). Absorbs the wingtip fact
        formerly tested by QB10 (removed). Revised from answer=[1] (1 correct) to 2 correct.


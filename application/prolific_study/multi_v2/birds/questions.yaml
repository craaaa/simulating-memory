      2: "Copperhook Finch — a slate-gray bird that feeds on insects and small carrion"
      3: "Ashen Skreel — a rust-orange bird with black wingtips that feeds on seeds and fruit"
      4: "Ashen Skreel — a slate-gray bird that feeds on insects and small carrion"
      5: "None of the above"
    answer: [1]
    metadata:
      type: content

      concepts: [scutum_pulsar]
      notes: "Option 1 paraphrases 'regular radio pulses' (the mechanism). Option 2 paraphrases 'detect gravitational waves' (the scientific value). Option 3 is Pictor scientific value. Option 4 is Pyxis scientific value."

  - q_id: QA08

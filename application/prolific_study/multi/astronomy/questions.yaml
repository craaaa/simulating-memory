    options:
      1: "How clouds of gas gradually pull together to birth new stars"
      2: "How the process of star birth eventually comes to an end"
      3: "How an old star draws material from a nearby companion"
      4: "How stars that formed at the same time change as they age"
      5: "None of the above"
    answer: [1, 2]
    metadata:
      type: content
      feature: scientific_value
      concepts: [pictor_nebula]
      notes: "Paraphrases of QA01 correct options with different wording. Option 3 is W Microscopii scientific value. Option 4 is Pyxis Cluster scientific value."

  - q_id: QA09
    question: "How do scientists observe the Pictor Nebula? Select all that apply."
    options:

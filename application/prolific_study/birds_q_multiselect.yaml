  - q_id: QS10
    question: >-
      Select all statements that are consistent with the passage.
    options:
      A: The 11-cm size and gliding flight are traits the passage gives the sunwhistle.
      B: The two-note call and densely forested habitat are traits the passage gives the crestling.
      C: The 11-cm size and gliding flight are traits the passage gives the crestling.
      D: The two-note call and gliding flight are traits the passage gives the sunwhistle.

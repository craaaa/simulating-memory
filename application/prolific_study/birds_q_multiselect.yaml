# Multi-select (select-all-that-apply) binding-sensitive MCQ bank
# Passages: birds.md (control) / birds_listed.md / birds_distractors.md / birds_repeat.md / birds_easier.md
#
# Design rule: every FALSE option is a TRUE trait of the OTHER species (a trait-swap),
# so the only way to miss is a misbinding -- the thing the order manipulation taxes.
#
# CUE-MATCH FACTOR (on the five 2-true items):
#   cue_match: exact      -> correct options reproduce the control passage's wording verbatim
#   cue_match: paraphrase -> correct options restate the fact with low surface overlap
#
# NOTE (2026-06-17): All items now paraphrased. The 'exact' condition has been
# collapsed -- cue_match is no longer an experimental factor, only paraphrase items
# remain. Original exact items: QS01, QS04, QS06.
#   QS04: was exact; correct options A and B reworded, false option D reworded to match.
#   QS06: header had listed as exact; per-item field had 'paraphrase' (inconsistency in
#         original). Option A was near-verbatim; now paraphrased. Resolved to paraphrase.
#   QS07: correct options A and B were verbatim; false options C and D were verbatim;
#         all reworded.
#   QS05: correct options A, B, C were all verbatim (cue_match: null item); reworded.
#   QS01, QS08, QS03, QS02, QS09, QS10: no change (already paraphrased or not prose).
#   QS02, QS09: scientific names / trait labels -- no meaningful paraphrase possible.
#
# answer is a LIST of correct option letters.
# difficulty: "calibrate" -> set empirically from the control arm; keep items ~50-70% all-correct.
#
# SCORING: primary = per-statement (Hamming) across A-E; secondary = all-or-nothing.


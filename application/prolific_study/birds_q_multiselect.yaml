# Multi-select (select-all-that-apply) binding-sensitive MCQ bank
# Passages: birds.md (control) / birds_listed.md / birds_distractors.md / birds_repeat.md / birds_easier.md
#
# Design rule: every FALSE option is a TRUE trait of the OTHER species (a trait-swap),
# so the only way to miss is a misbinding -- the thing the order manipulation taxes.
#
# CUE-MATCH FACTOR (on the five 2-true items):
#   cue_match: exact      -> correct options reproduce the control passage's wording verbatim
#   cue_match: paraphrase -> correct options restate the fact with low surface overlap
#   Split ~half: exact = QS01, QS04, QS06 ; paraphrase = QS02, QS03.
#   NOTE: "exact" is defined against birds.md. It holds for control, listed, distractors,
#   and repeat (all keep control's phrasing). For birds_easier, which paraphrases the
#   passage, the exact/paraphrase contrast is CONFOUNDED -- interpret cue-match only within
#   the four control-worded texts.
#
# answer is a LIST of correct option letters.
# difficulty: "calibrate" -> set empirically from the control arm; keep items ~50-70% all-correct.
#
# SCORING: primary = per-statement (Hamming) across A-E; secondary = all-or-nothing.

title: Birds passage - binding-sensitive multi-select
answer_type: multi_select
scoring: per_statement
metadata:
  primary_subset: [QS01, QS02, QS03, QS04, QS05, QS06, QS08, QS09, QS10]
  cue_match_exact: [QS01, QS04, QS06]
  cue_match_paraphrase: [QS02, QS03]

questions:
  - q_id: QS07
    question: "Select all statements that are TRUE."
    options:
      A: The crestling inhabits cloud forests of upland river valleys.
      B: The sunwhistle inhabits open coastal scrubland.
      C: The crestling is a migratory species.
      D: The sunwhistle defends a fixed territory year-round.
      E: None of the above
    answer: [A, B]
    metadata:
      difficulty: calibrate
      cue_match: exact
      tags: { relational: true, within_category: false, edges: 4 }
      notes: "Habitat. Correct options reproduce control wording verbatim."


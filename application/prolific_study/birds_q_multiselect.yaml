    answer: [A, B]
    metadata:
      difficulty: calibrate
      cue_match: null
      tags: { relational: true, within_category: false, edges: 6 }
      notes: "Flagship trait-mixing inference, recast as multi-select: the component bindings (A, B) plus the 'matches neither' conclusion (E) are correct; the clean-match claims (C, D) are false. E is no longer keyed alone, so a 'pick the reject option' heuristic fails."
